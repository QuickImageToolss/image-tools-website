<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Image Tools - Free Online Image Editor</title>
<meta name="description" content="Free online image compressor, resizer, converter and cropper. Easily optimize your images.">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#173b75;color:white;padding:25px 15px;text-align:center}
header h1{margin:0;font-size:27px}
header p{color:#dce8ff}
.container{max-width:900px;margin:25px auto;padding:15px}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button,.tool{
border:0;border-radius:9px;padding:13px;
background:#fff;color:#173b75;
font-weight:bold;cursor:pointer;
box-shadow:0 2px 8px #00000012
}
button.active,.primary{background:#1764d2;color:white}
.panel{background:white;margin-top:20px;padding:22px;border-radius:13px;box-shadow:0 3px 15px #00000010}
input,select{width:100%;padding:12px;margin:10px 0;border:1px solid #ccd3df;border-radius:7px}
label{font-weight:bold}
.primary{width:100%;margin-top:15px}
#preview{max-width:100%;max-height:300px;display:block;margin:15px auto}
#status{text-align:center;color:#1764d2;margin-top:15px}
footer{text-align:center;padding:25px;color:#657086}
@media(max-width:500px){.tools{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header>
<h1>Quick Image Tools</h1>
<p>Free Online Image Compressor, Resizer & Converter</p>
</header>

<div class="container">

<h2>Choose Your Image Tool</h2>

<div class="tools">
<button onclick="setTool('compress')" class="active">Image Compressor</button>
<button onclick="setTool('resize')">Image Resizer</button>
<button onclick="setTool('jpgpng')">JPG to PNG</button>
<button onclick="setTool('pngjpg')">PNG to JPG</button>
<button onclick="setTool('crop')">Image Cropper</button>
<button onclick="setTool('convert')">Image Converter</button>
</div>

<div class="panel">

<h2 id="toolTitle">Image Compressor</h2>

<label>Select Your Image</label>
<input type="file" id="file" accept="image/*">

<img id="preview" hidden>

<div id="options">

<label>Image Quality (%)</label>
<input type="number" id="quality" value="80" min="10" max="100">

</div>

<button class="primary" onclick="processImage()">Process Image</button>

<p id="status"></p>

<a id="download" hidden>
<button class="primary">Download Image</button>
</a>

</div>

</div>

<footer>
<p>© 2026 Quick Image Tools. All Rights Reserved.</p>
<p>Your images are processed in your browser.</p>
</footer>

<script>
let tool='compress';
let image=new Image();
let selectedFile=null;

const file=document.getElementById('file');
const preview=document.getElementById('preview');
const options=document.getElementById('options');

const titles={
compress:'Image Compressor',
resize:'Image Resizer',
jpgpng:'JPG to PNG Converter',
pngjpg:'PNG to JPG Converter',
crop:'Image Cropper',
convert:'Image Converter'
};

function setTool(name){
tool=name;
document.getElementById('toolTitle').textContent=titles[name];

document.querySelectorAll('.tools button').forEach(b=>{
b.classList.remove('active');
});
event.currentTarget.classList.add('active');

if(name==='compress'){
options.innerHTML=`
<label>Image Quality (%)</label>
<input type="number" id="quality" value="80" min="10" max="100">`;
}

if(name==='resize'){
options.innerHTML=`
<label>Width (pixels)</label>
<input type="number" id="width" value="800">
<label>Height (pixels)</label>
<input type="number" id="height" value="600">`;
}

if(name==='crop'){
options.innerHTML=`
<label>Crop X (%)</label><input id="x" type="number" value="0">
<label>Crop Y (%)</label><input id="y" type="number" value="0">
<label>Crop Width (%)</label><input id="width" type="number" value="80">
<label>Crop Height (%)</label><input id="height" type="number" value="80">`;
}

if(name==='convert'){
options.innerHTML=`
<label>Choose Output Format</label>
<select id="format">
<option value="image/jpeg">JPG</option>
<option value="image/png">PNG</option>
<option value="image/webp">WEBP</option>
</select>`;
}

if(name==='jpgpng'||name==='pngjpg'){
options.innerHTML='<p>Choose an image and convert it to the required format.</p>';
}

document.getElementById('status').textContent='';
document.getElementById('download').hidden=true;
}

file.addEventListener('change',()=>{
selectedFile=file.files[0];
if(!selectedFile)return;

const url=URL.createObjectURL(selectedFile);
image.onload=()=>{
preview.src=url;
preview.hidden=false;
};
image.src=url;
document.getElementById('status').textContent='Image selected successfully!';
});

function processImage(){
if(!selectedFile||!image.naturalWidth){
alert('Please select an image first.');
return;
}

const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d');

let w=image.naturalWidth;
let h=image.naturalHeight;
let format='image/jpeg';
let quality=.85;

if(tool==='resize'){
w=Number(document.getElementById('width').value);
h=Number(document.getElementById('height').value);
if(!w||!h||w<1||h<1||w>10000||h>10000){
alert('Enter valid dimensions (1-10000).');
return;
}
}

if(tool==='compress'){
quality=Number(document.getElementById('quality').value)/100;
if(quality<.1||quality>1){
alert('Quality must be between 10 and 100.');
return;
}
}

if(tool==='jpgpng')format='image/png';
if(tool==='pngjpg')format='image/jpeg';

if(tool==='convert'){
format=document.getElementById('format').value;
}

if(tool==='crop'){
const x=Number(document.getElementById('x').value);
const y=Number(document.getElementById('y').value);
const cw=Number(document.getElementById('width').value);
const ch=Number(document.getElementById('height').value);

if(x<0||y<0||cw<=0||ch<=0||x+cw>100||y+ch>100){
alert('Enter valid crop percentages.');
return;
}

const sx=Math.round(w*x/100);
const sy=Math.round(h*y/100);
const sw=Math.round(w*cw/100);
const sh=Math.round(h*ch/100);

canvas.width=sw;
canvas.height=sh;
ctx.drawImage(image,sx,sy,sw,sh,0,0,sw,sh);
}else{
canvas.width=w;
canvas.height=h;
ctx.drawImage(image,0,0,w,h);
}

canvas.toBlob(blob=>{
if(!blob){
alert('Conversion failed. Try another image.');
return;
}

const url=URL.createObjectURL(blob);
const link=document.getElementById('download');
link.href=url;
link.download='quick-image-tools.'+
(format==='image/png'?'png':
format==='image/webp'?'webp':'jpg');
link.hidden=false;

document.getElementById('status').textContent=
'Your image is ready! Click Download Image.';
},format,quality);
}
</script>

</body>
  </html>
